# مِداد | MIDAD — self-contained Apache config for hosting on this Windows PC behind a Cloudflare Tunnel.
# Start:  C:\xampp\apache\bin\httpd.exe -f "C:/Users/aziz4/quotiet/deploy/windows/midad-httpd.conf"
# It listens on 127.0.0.1 only (the tunnel is the only way in) and serves only the project's public/ folder,
# so .env, the database and the source code can never be downloaded. XAMPP's own httpd.conf is not used.

Define PROJECT "C:/Users/aziz4/quotiet"
ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:8127
ServerName 127.0.0.1:8127
PidFile "${PROJECT}/storage/logs/apache.pid"
ErrorLog "${PROJECT}/storage/logs/apache-error.log"
LogLevel warn
ServerTokens Prod
ServerSignature Off
TraceEnable Off

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule brotli_module modules/mod_brotli.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule env_module modules/mod_env.so

LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPIniDir "C:/xampp/php"
# Under Apache on Windows the JIT compilers cannot get executable memory ("VirtualProtect() failed" in the log)
# and fall back on every request, which made pages ~4× slower. OPcache itself stays on.
php_admin_value opcache.jit disable
php_admin_value pcre.jit 0
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

TypesConfig conf/mime.types
AddType font/woff2 .woff2
AddType image/webp .webp

ThreadsPerChild 64
KeepAlive On
Timeout 60

DocumentRoot "${PROJECT}/public"
DirectoryIndex index.php
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "${PROJECT}/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
# Never serve dotfiles (.env, .htaccess, .git) even if one ends up inside public/.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Production settings for Laravel. Caches live in storage/framework/prod-cache so `php artisan test` never reads them;
# refresh them after changes with the same variables set (see DEPLOY.md, "This PC").
SetEnv APP_ENV production
SetEnv APP_DEBUG false
SetEnv FORCE_HTTPS true
SetEnv SESSION_SECURE_COOKIE true
SetEnv SESSION_ENCRYPT true
SetEnv SESSION_HTTP_ONLY true
SetEnv LOG_LEVEL warning
SetEnv APP_CONFIG_CACHE storage/framework/prod-cache/config.php
SetEnv APP_ROUTES_CACHE storage/framework/prod-cache/routes.php
SetEnv APP_EVENTS_CACHE storage/framework/prod-cache/events.php
